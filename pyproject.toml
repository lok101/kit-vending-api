[project]
name = "kit-api"
version = "0.4.0"
requires-python = ">=3.10"
keywords = ["kit", "vending", "api", "client"]

dependencies = [
    "aiohttp>=3.13.2",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.5",
    "tzdata>=2025.3",
    "beartype>=0.22.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.13.3",
    "mypy>=1.13.0",
    "pyright>=1.1.390",
]
test = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/kit-api"
Documentation = "https://github.com/yourusername/kit-api#readme"
Repository = "https://github.com/yourusername/kit-api"
Issues = "https://github.com/yourusername/kit-api/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kit_api"]
exclude = [
    "/tests",
    "/tests/*",
    "/__test__.py",
]

[tool.black]
line-length = 100
target-version = ['py314']

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v"

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["kit_api"]
plugins = ["pydantic.mypy"]
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = "dotenv.*"
ignore_missing_imports = true

[tool.pyright]
include = ["kit_api"]
exclude = ["**/tests", "**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
